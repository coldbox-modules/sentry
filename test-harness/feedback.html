<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentry verification harness</title><style>body{font:18px/1.5 system-ui;max-width:780px;margin:40px auto;padding:24px}label{display:block;margin:16px 0}input,textarea{font:inherit;padding:8px;width:90%}</style></head><body><h1>Sentry verification harness</h1><p>All feedback and replay data goes to a local byte-preserving receiver.</p><label>Ordinary unsaved note<textarea>Visible synthetic note</textarea></label><label>Password displayed as text<input type="text" name="password" value="SYNTHETIC-SECRET"></label><div data-sentry-mask>SYNTHETIC-MASKED</div><script src="/assets/sentry/sentry-box.js"></script><script>
